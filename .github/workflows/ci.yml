name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @calc/api exec prisma generate

      - name: Build shared packages
        run: pnpm --filter @calc/shared build && pnpm --filter @calc/engine build

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @calc/web exec next build
